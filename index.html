<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4faf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1812" media="(prefers-color-scheme: dark)" />
    <script>
      // Light or dark mode chosen in Settings, applied before anything is drawn (see src/lib/theme.ts).
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <meta name="color-scheme" content="light dark" />
    <!-- iPhone home-screen app: its name and full-screen mode. -->
    <meta name="apple-mobile-web-app-title" content="PrixIt" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Log supermarket prices by scanning barcodes and price tags." />
    <title>PrixIt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
